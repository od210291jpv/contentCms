version: '3.8'

services:
  contentcms-api:
    image: contentcms-api:latest
    container_name: contentcms-api
    restart: always
    ports:
      - "8085:8080"
    volumes:
      # Mount local images directory to /app/wwwroot/img in the container
      - ./images:/app/wwwroot/img
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - contentcms-network
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - contentcms-network

networks:
  contentcms-network:
    driver: bridge
